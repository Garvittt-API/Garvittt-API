<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" fill="none" role="img" aria-label="Garvittt - cybersecurity student and Discord API developer">
  <title>Garvittt - Cybersecurity student, Discord API developer, logic-driven builder</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="0.55" stop-color="#f2f6ff"/>
      <stop offset="1" stop-color="#e9efff"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="40" y1="140" x2="500" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b93b5">
        <animate attributeName="stop-color" values="#0b93b5;#22c1dc;#0b93b5;#0b93b5" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.52" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#db2777">
        <animate attributeName="stop-color" values="#db2777;#e854a3;#db2777;#db2777" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="barGrad" x1="64" y1="230" x2="330" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b93b5"/>
      <stop offset="0.5" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1024" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0b1024" stop-opacity=".05"/>
      <stop offset="1" stop-color="#0b1024" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panelFill" x1="736" y1="88" x2="1216" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#070c18"/>
    </linearGradient>

    <linearGradient id="panelEdge" x1="736" y1="88" x2="1216" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b93b5" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#6d28d9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="progress" x1="64" y1="0" x2="1216" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b93b5" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#6d28d9" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b93b5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b93b5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>

    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#b9c8ea" stroke-opacity=".55" stroke-width="1"/>
    </pattern>

    <mask id="gridMask">
      <rect width="1280" height="380" fill="url(#gridFade)"/>
    </mask>

    <clipPath id="cardClip">
      <rect width="1280" height="380" rx="26"/>
    </clipPath>
  </defs>

  <style>
    .rise { opacity: 0; animation: rise .85s cubic-bezier(.22,.8,.28,1) forwards; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .slide { opacity: 0; animation: slide .7s cubic-bezier(.22,.8,.28,1) forwards; }
    @keyframes slide {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .glitchA, .glitchB { opacity: 0; }
    .glitchA { animation: glitchA 7.5s steps(1,end) infinite; }
    .glitchB { animation: glitchB 7.5s steps(1,end) infinite; }
    @keyframes glitchA {
      0%, 91%, 100% { opacity: 0; transform: translate(0,0); }
      92% { opacity: .75; transform: translate(-5px, 2px); }
      93% { opacity: .45; transform: translate(3px, -1px); }
      94% { opacity: .7;  transform: translate(-2px, 1px); }
      95% { opacity: 0;   transform: translate(0,0); }
    }
    @keyframes glitchB {
      0%, 91%, 100% { opacity: 0; transform: translate(0,0); }
      92% { opacity: .6;  transform: translate(5px, -2px); }
      93% { opacity: .4;  transform: translate(-3px, 2px); }
      94% { opacity: .65; transform: translate(2px, -1px); }
      95% { opacity: 0;   transform: translate(0,0); }
    }
    .driftA { animation: driftA 18s ease-in-out infinite alternate; }
    @keyframes driftA {
      from { transform: translate(0,0); }
      to   { transform: translate(26px,-18px); }
    }
    .driftB { animation: driftB 22s ease-in-out infinite alternate; }
    @keyframes driftB {
      from { transform: translate(0,0); }
      to   { transform: translate(-30px,16px); }
    }
    .dot { animation: bob 6s ease-in-out infinite; }
    @keyframes bob {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-7px); }
    }
    .pulse { animation: pulse 3.4s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { opacity: .25; }
      50%     { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rise, .slide, .dot, .pulse, .driftA, .driftB { animation: none; opacity: 1; }
      .glitchA, .glitchB { animation: none; opacity: 0; }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#grid)" mask="url(#gridMask)"/>

    <ellipse class="driftA" cx="250" cy="70" rx="300" ry="190" fill="url(#glowC)" opacity=".22"/>
    <ellipse class="driftB" cx="880" cy="360" rx="340" ry="210" fill="url(#glowV)" opacity=".22"/>
    <ellipse class="driftA" cx="1180" cy="40" rx="240" ry="160" fill="url(#glowP)" opacity=".22"/>

    <rect width="1280" height="380" fill="url(#sheen)">
      <animate attributeName="x" values="-260;1180;1180" keyTimes="0;0.5;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- decorative brackets -->
    <path d="M40 66V40H66" stroke="#0b93b5" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
    <path d="M1240 314V340H1214" stroke="#db2777" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>

    <!-- floating particles -->
    <g fill="#0b93b5">
      <circle class="dot" cx="700" cy="64" r="2.4" opacity=".55" style="animation-delay:-1s"/>
      <circle class="dot" cx="614" cy="322" r="2" opacity=".4" style="animation-delay:-2.4s"/>
      <circle class="dot" cx="470" cy="92" r="1.8" opacity=".35" style="animation-delay:-3.6s"/>
      <circle class="dot" cx="118" cy="336" r="2.2" opacity=".3" style="animation-delay:-.6s"/>
      <circle class="dot" cx="40" cy="196" r="1.6" opacity=".35" style="animation-delay:-4.2s"/>
    </g>
    <g fill="#db2777">
      <circle class="dot" cx="566" cy="46" r="2.2" opacity=".45" style="animation-delay:-2s"/>
      <circle class="dot" cx="686" cy="268" r="1.8" opacity=".35" style="animation-delay:-5s"/>
      <circle class="dot" cx="1236" cy="150" r="2.4" opacity=".45" style="animation-delay:-3s"/>
      <circle class="dot" cx="360" cy="352" r="1.6" opacity=".3" style="animation-delay:-1.8s"/>
    </g>
    <g fill="#6d28d9">
      <circle class="dot" cx="524" cy="150" r="1.8" opacity=".4" style="animation-delay:-.9s"/>
      <circle class="dot" cx="94" cy="76" r="2" opacity=".35" style="animation-delay:-4.8s"/>
      <circle class="dot" cx="648" cy="196" r="1.6" opacity=".3" style="animation-delay:-2.7s"/>
    </g>

    <!-- status pill -->
    <g class="rise" style="animation-delay:.25s">
      <rect x="1042" y="42" width="174" height="30" rx="15" fill="#0b93b5" fill-opacity=".07" stroke="#0b93b5" stroke-opacity=".35"/>
      <circle cx="1062" cy="57" r="4" fill="#3ddc84">
        <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="1076" y="61.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#0b93b5" fill-opacity=".9">OPEN TO COLLAB</text>
    </g>

    <!-- eyebrow -->
    <g class="rise" style="animation-delay:.05s">
      <circle cx="69" cy="107" r="4" fill="#0b93b5">
        <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="86" y="112" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="3.4" fill="#0b93b5" fill-opacity=".92">SECURITY / AUTOMATION / OPEN SOURCE</text>
    </g>

    <!-- name -->
    <g>
      <text class="glitchA" x="60" y="204" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="#db2777" fill-opacity=".5">Garvittt<tspan dx="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="30" font-weight="600" letter-spacing="0">.exe</tspan></text>
      <text class="glitchB" x="68" y="204" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="#0b93b5" fill-opacity=".45">Garvittt<tspan dx="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="30" font-weight="600" letter-spacing="0">.exe</tspan></text>
      <text class="rise" style="animation-delay:.15s" x="64" y="204" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#nameGrad)">Garvittt<tspan dx="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="30" font-weight="600" letter-spacing="0" fill="#54628a" fill-opacity=".8">.exe</tspan></text>
    </g>

    <g class="rise" style="animation-delay:.4s">
      <rect x="64" y="226" width="150" height="4" rx="2" fill="url(#barGrad)">
        <animate attributeName="width" values="150;264;150" dur="6s" repeatCount="indefinite"/>
      </rect>
      <circle cx="64" cy="228" r="4" fill="#0b93b5"/>
    </g>

    <!-- credentials -->
    <g class="rise" style="animation-delay:.55s">
      <text x="64" y="272" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17.5" font-weight="500" fill="#54628a">Cybersecurity student<tspan font-weight="400" fill="#8794b4">&#160;&#160;·&#160;&#160;</tspan>Discord API developer<tspan font-weight="400" fill="#8794b4">&#160;&#160;·&#160;&#160;</tspan>logic-driven builder</text>
    </g>

    <g class="rise" style="animation-delay:.7s">
      <text x="64" y="316" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#8794b4">github.com/<tspan fill="#0b93b5">Garvittt-API</tspan>&#160;&#160;—&#160;&#160;30 repos · 270+ stars</text>
    </g>

    <!-- terminal -->
    <g class="slide" style="animation-delay:.45s">
      <rect x="736" y="88" width="480" height="216" rx="16" fill="url(#panelFill)" stroke="url(#panelEdge)" stroke-width="1.4"/>
      <rect x="736" y="88" width="480" height="38" rx="16" fill="#070c18" fill-opacity=".85"/>
      <rect x="736" y="112" width="480" height="14" fill="#070c18" fill-opacity=".85"/>
      <line x1="736" y1="126" x2="1216" y2="126" stroke="#c9d6f2" stroke-opacity=".7"/>

      <circle cx="760" cy="107" r="5" fill="#ff5f57"/>
      <circle cx="777" cy="107" r="5" fill="#febc2e"/>
      <circle cx="794" cy="107" r="5" fill="#28c840"/>
      <text x="1196" y="112" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#7c8cb0" text-anchor="end">garvit@api — zsh</text>

      <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14">
        <g class="rise" style="animation-delay:1.0s">
          <text x="760" y="156" fill="#0b93b5">$</text>
          <text x="778" y="156" fill="#cfdcf7">whoami</text>
        </g>
        <g class="rise" style="animation-delay:1.25s">
          <text x="778" y="181" fill="#7c8cb0">garvit · cybersecurity student</text>
        </g>
        <g class="rise" style="animation-delay:1.5s">
          <text x="760" y="206" fill="#0b93b5">$</text>
          <text x="778" y="206" fill="#cfdcf7">stack --core</text>
        </g>
        <g class="rise" style="animation-delay:1.75s">
          <text x="778" y="231" fill="#7c8cb0">node · python · typescript · go</text>
        </g>
        <g class="rise" style="animation-delay:2.0s">
          <text x="760" y="256" fill="#0b93b5">$</text>
          <text x="778" y="256" fill="#cfdcf7">cat now.txt</text>
        </g>
        <g class="rise" style="animation-delay:2.25s">
          <text x="778" y="281"><tspan fill="#db2777">shipping</tspan><tspan fill="#cfdcf7"> Val-X · ScamLens · Aegis-Scan</tspan></text>
          <rect x="1118" y="269" width="8.5" height="15" rx="2" fill="#0b93b5">
            <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- bottom progress -->
    <g class="rise" style="animation-delay:.9s">
      <rect x="64" y="348" width="1152" height="2" rx="1" fill="#d5dff5" fill-opacity=".5"/>
      <rect x="64" y="347" width="420" height="4" rx="2" fill="url(#progress)">
        <animate attributeName="width" values="240;700;240" dur="11s" repeatCount="indefinite"/>
      </rect>
      <circle r="3" fill="#0b93b5">
        <animate attributeName="cx" values="304;764;304" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="349;349;349" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".9;.5;.9" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="378.5" rx="25" stroke="#d5dff5" stroke-opacity=".65" stroke-width="1.5"/>
</svg>
