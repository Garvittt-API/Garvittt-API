<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-label="Garvittt.exe — cybersecurity student and Discord API developer">
  <title>Garvittt.exe — cybersecurity student, Discord API developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBFFFE"/><stop offset="0.55" stop-color="#F2FBF8"/><stop offset="1" stop-color="#E9F7F2"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="50" y1="130" x2="470" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E9F7B"><animate attributeName="stop-color" values="#0E9F7B;#0B8265;#0E9F7B;#0E9F7B" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="0.6" stop-color="#0E9F7B"/><stop offset="1" stop-color="#0C7F93"/>
    </linearGradient>
    <linearGradient id="bar" x1="64" y1="0" x2="330" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E9F7B"/><stop offset="0.6" stop-color="#0C7F93"/><stop offset="1" stop-color="#0C7F93" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="940" y1="40" x2="1120" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E9F7B" stop-opacity=".14"/><stop offset="1" stop-color="#0C7F93" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="shieldStroke" x1="940" y1="40" x2="1120" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E9F7B"/><stop offset="1" stop-color="#0C7F93"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E9F7B" stop-opacity="0"/><stop offset="0.5" stop-color="#0E9F7B" stop-opacity=".85"/><stop offset="1" stop-color="#0E9F7B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/><stop offset="0.6" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0E9F7B" stop-opacity=".6"/><stop offset="1" stop-color="#0E9F7B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0C7F93" stop-opacity=".45"/><stop offset="1" stop-color="#0C7F93" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#B7D8CE" stroke-opacity=".5" stroke-width="1"/>
    </pattern>
    <mask id="gridMask"><rect width="1280" height="320" fill="url(#gridFade)"/></mask>
    <clipPath id="card"><rect width="1280" height="320" rx="22"/></clipPath>
    <clipPath id="shieldClipPath">
      <path d="M1030 42 L1128 78 V150 C1128 205 1088 238 1030 256 C972 238 932 205 932 150 V78 Z"/>
    </clipPath>
  </defs>

  <style>
    .in { opacity: 0; animation: in .9s cubic-bezier(.22,.8,.28,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade 1.2s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .g1 { opacity: 0; animation: g1 8s steps(1,end) infinite; }
    .g2 { opacity: 0; animation: g2 8s steps(1,end) infinite; }
    @keyframes g1 {
      0%,93%,100% { opacity: 0; transform: translate(0,0); }
      94% { opacity: .7; transform: translate(-4px,1px); }
      95% { opacity: .4; transform: translate(3px,-1px); }
      96% { opacity: .6; transform: translate(-2px,0); }
      97% { opacity: 0; }
    }
    @keyframes g2 {
      0%,93%,100% { opacity: 0; transform: translate(0,0); }
      94% { opacity: .55; transform: translate(4px,-1px); }
      95% { opacity: .35; transform: translate(-3px,1px); }
      96% { opacity: .5; transform: translate(2px,0); }
      97% { opacity: 0; }
    }
    .drift { animation: drift 20s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(24px,-14px); } }
    .bob { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .bob, .drift { animation: none; opacity: 1; }
      .g1, .g2 { animation: none; opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
    <ellipse class="drift" cx="250" cy="40" rx="300" ry="170" fill="url(#glowM)" opacity=".16"/>
    <ellipse class="drift" cx="1080" cy="300" rx="300" ry="180" fill="url(#glowC)" opacity=".16"/>

    <path d="M1240 258V280H1218" stroke="#0C7F93" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>

    <g fill="#0E9F7B">
      <circle class="bob" cx="700" cy="60" r="2.2" opacity=".5" style="animation-delay:-1s"/>
      <circle class="bob" cx="600" cy="286" r="1.8" opacity=".35" style="animation-delay:-2.6s"/>
      <circle class="bob" cx="452" cy="88" r="1.6" opacity=".3" style="animation-delay:-3.8s"/>
      <circle class="bob" cx="96" cy="270" r="2" opacity=".28" style="animation-delay:-.8s"/>
    </g>
    <g fill="#0C7F93">
      <circle class="bob" cx="560" cy="42" r="2" opacity=".4" style="animation-delay:-2s"/>
      <circle class="bob" cx="676" cy="252" r="1.7" opacity=".3" style="animation-delay:-4.4s"/>
      <circle class="bob" cx="1210" cy="120" r="2" opacity=".35" style="animation-delay:-3s"/>
    </g>

    <!-- status -->
    <g class="in" style="animation-delay:.3s">
      <rect x="64" y="26" width="152" height="26" rx="13" fill="#0E9F7B" fill-opacity=".08" stroke="#0E9F7B" stroke-opacity=".3"/>
      <circle cx="80" cy="39" r="3.4" fill="#0E9F7B">
        <animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="92" y="43" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.8" fill="#0E9F7B" fill-opacity=".9">OPEN TO WORK</text>
    </g>

    <!-- shield -->
    <g class="fade" style="animation-delay:.2s">
      <path d="M1030 42 L1128 78 V150 C1128 205 1088 238 1030 256 C972 238 932 205 932 150 V78 Z"
            fill="url(#shieldFill)" stroke="url(#shieldStroke)" stroke-width="2" stroke-linejoin="round"/>
      <g clip-path="url(#shieldClipPath)">
        <rect x="932" y="0" width="196" height="26" fill="url(#scan)" opacity=".5">
          <animate attributeName="y" values="30;250;250" keyTimes="0;.75;1" dur="5.5s" repeatCount="indefinite"/>
        </rect>
        <path d="M1016 150 v-16 a14 14 0 0 1 28 0 v16" stroke="#0E9F7B" stroke-width="3.2" stroke-linecap="round" fill="none"/>
        <rect x="1004" y="150" width="52" height="42" rx="7" fill="#0E9F7B" fill-opacity=".14" stroke="#0E9F7B" stroke-width="2.4"/>
        <circle cx="1030" cy="167" r="4.6" fill="#0E9F7B"/>
        <rect x="1028" y="170" width="4" height="10" rx="2" fill="#0E9F7B"/>
      </g>
      <circle cx="1030" cy="150" r="120" stroke="#0E9F7B" stroke-opacity=".1" stroke-width="1" fill="none">
        <animate attributeName="r" values="112;126;112" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- eyebrow -->
    <g class="in" style="animation-delay:.05s">
      <circle cx="69" cy="91" r="3.6" fill="#0E9F7B">
        <animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="96" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="3.2" fill="#0E9F7B" fill-opacity=".9">SECURITY / AUTOMATION / OPEN SOURCE</text>
    </g>

    <!-- name -->
    <g>
      <text class="g1" x="60" y="186" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="#0C7F93" fill-opacity=".45">Garvittt<tspan dx="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="28" font-weight="600" letter-spacing="0">.exe</tspan></text>
      <text class="g2" x="68" y="186" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="#0E9F7B" fill-opacity=".4">Garvittt<tspan dx="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="28" font-weight="600" letter-spacing="0">.exe</tspan></text>
      <text class="in" style="animation-delay:.12s" x="64" y="186" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#nameGrad)">Garvittt<tspan dx="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="28" font-weight="600" letter-spacing="0" fill="#4A6270" fill-opacity=".75">.exe</tspan></text>
    </g>
    <g class="in" style="animation-delay:.35s">
      <rect x="64" y="206" width="132" height="3.5" rx="2" fill="url(#bar)">
        <animate attributeName="width" values="132;250;132" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- tagline -->
    <g class="in" style="animation-delay:.5s">
      <text x="64" y="248" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#4A6270">Cybersecurity student<tspan font-weight="400" fill="#8199A4">&#160;&#160;·&#160;&#160;</tspan>Discord API developer<tspan font-weight="400" fill="#8199A4">&#160;&#160;·&#160;&#160;</tspan>ships fast</text>
    </g>

    <g class="in" style="animation-delay:.65s">
      <text x="64" y="288" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#8199A4">github.com/<tspan fill="#0E9F7B">Garvittt-API</tspan>&#160;&#160;—&#160;&#160;30 repos · 270+ stars</text>
    </g>

    <rect x="0" y="316" width="1280" height="4" fill="url(#bar)" opacity=".5"/>
  </g>
  <rect x=".75" y=".75" width="1278.5" height="318.5" rx="21" stroke="#CFE6DE" stroke-width="1.5"/>
</svg>
