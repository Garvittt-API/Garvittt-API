<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="434" viewBox="0 0 1100 434" fill="none" role="img" aria-label="Terminal showing Garvittt's system specs">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="1100" y2="434" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060F12"/><stop offset="1" stop-color="#04191A"/>
    </linearGradient>
    <linearGradient id="winEdge" x1="0" y1="0" x2="1100" y2="434" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5A0" stop-opacity=".55"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity=".3"/>
      <stop offset="1" stop-color="#00E5A0" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5A0" stop-opacity=".22"/><stop offset="1" stop-color="#00E5A0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="winClip"><rect width="1100" height="434" rx="16"/></clipPath>
  </defs>

  <style>
    .ln { opacity: 0; animation: ln .5s ease forwards; }
    @keyframes ln { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    .cur { animation: cur 1.1s steps(1,end) infinite; }
    @keyframes cur { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .sweep { animation: sweep 9s linear infinite; }
    @keyframes sweep {
      0% { transform: translateY(-40px); opacity: 0; }
      8% { opacity: .5; }
      50% { opacity: .5; }
      60% { transform: translateY(470px); opacity: 0; }
      100% { transform: translateY(470px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .ln { animation: none; opacity: 1; } .cur, .sweep { animation: none; } }
  </style>

  <g clip-path="url(#winClip)">
    <rect width="1100" height="434" fill="url(#win)"/>
    <ellipse cx="140" cy="380" rx="300" ry="170" fill="url(#tglow)"/>
    <ellipse cx="960" cy="40" rx="260" ry="140" fill="url(#tglow)" opacity=".6"/>

    <rect width="1100" height="44" fill="#04191A" fill-opacity=".9"/>
    <circle cx="26" cy="22" r="6" fill="#FF5F57"/>
    <circle cx="46" cy="22" r="6" fill="#FEBC2E"/>
    <circle cx="66" cy="22" r="6" fill="#28C840"/>
    <text x="550" y="27" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#587280" text-anchor="middle">garvit@api — zsh — 110×28</text>
    <line x1="0" y1="44" x2="1100" y2="44" stroke="#00E5A0" stroke-opacity=".16"/>

    <rect class="sweep" x="0" y="0" width="1100" height="30" fill="#00E5A0" opacity="0" fill-opacity=".04"/>

    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15">
      <g class="ln" style="animation-delay:.35s">
        <text x="34" y="86" fill="#00E5A0">$</text><text x="52" y="86" fill="#D7EDE6">whoami</text>
      </g>
      <g class="ln" style="animation-delay:.5s">
        <text x="34" y="111" fill="#587280">garvit choudhary · cybersecurity student · india (IST)</text>
      </g>
      <g class="ln" style="animation-delay:.7s">
        <text x="34" y="146" fill="#00E5A0">$</text><text x="52" y="146" fill="#D7EDE6">neofetch --short</text>
      </g>

      <g class="ln" style="animation-delay:.9s" font-size="14.5">
        <text x="34" y="181" fill="#22D3EE">OS</text><text x="210" y="181" fill="#D7EDE6">Fedora Linux · x86_64</text>
      </g>
      <g class="ln" style="animation-delay:1.0s" font-size="14.5">
        <text x="34" y="208" fill="#22D3EE">Shell</text><text x="210" y="208" fill="#D7EDE6">zsh 5.9 · tmux</text>
      </g>
      <g class="ln" style="animation-delay:1.1s" font-size="14.5">
        <text x="34" y="235" fill="#22D3EE">Editor</text><text x="210" y="235" fill="#D7EDE6">neovim</text>
      </g>
      <g class="ln" style="animation-delay:1.2s" font-size="14.5">
        <text x="34" y="262" fill="#22D3EE">Langs</text><text x="210" y="262" fill="#D7EDE6">python · typescript · go · rust</text>
      </g>
      <g class="ln" style="animation-delay:1.3s" font-size="14.5">
        <text x="34" y="289" fill="#22D3EE">Focus</text><text x="210" y="289" fill="#D7EDE6">appsec · bots · automation</text>
      </g>
      <g class="ln" style="animation-delay:1.4s" font-size="14.5">
        <text x="34" y="316" fill="#22D3EE">Repos</text><text x="210" y="316" fill="#D7EDE6">30 public · 270+ stars</text>
      </g>
      <g class="ln" style="animation-delay:1.5s" font-size="14.5">
        <text x="34" y="343" fill="#22D3EE">Now</text><text x="210" y="343" fill="#D7EDE6">building Val-X &amp; ScamLens</text>
      </g>

      <g class="ln" style="animation-delay:1.75s">
        <text x="34" y="386" fill="#00E5A0">$</text>
        <rect class="cur" x="52" y="371" width="9" height="18" rx="2" fill="#00E5A0"/>
        <text x="72" y="386" fill="#587280" font-size="13">~ / waiting for input</text>
      </g>
    </g>
    <rect y="433" width="1100" height="1" fill="#00E5A0" fill-opacity=".18"/>
  </g>
  <rect x=".75" y=".75" width="1098.5" height="432.5" rx="15.5" stroke="url(#winEdge)" stroke-width="1.5"/>
</svg>
